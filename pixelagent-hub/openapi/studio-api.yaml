            - $ref: '#/components/schemas/Review'
            - type: object
              nullable: true
              enum:
                - null
        strategy:
          type: string
          enum:
            - manager-coder
            - coder-only
        finishedAt:
          type: string
        error:
          type: string
        stoppedPhase:
          type: string
        plan:
          $ref: '#/components/schemas/TaskResult'
        rounds:
          type: array
          items:
            type: object
            required:
              - round
              - code
            properties:
              round:
                type: integer
                minimum: 1
                maximum: 3
              code:
                $ref: '#/components/schemas/TaskResult'
              build:
                $ref: '#/components/schemas/BuildReport'
        previewFile:
          type: string
          pattern: ^v[1-3]/dist/index\.html$
        archiveFile:
          type: string
        generationMetrics:
          $ref: '#/components/schemas/GenerationMetrics'
  responses:
    Error400:
      description: Invalid input or project ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Project, record or route not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Project state, current preview or evidence does not satisfy this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Creation rate limit or runtime queue capacity exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Internal or stored-record error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
