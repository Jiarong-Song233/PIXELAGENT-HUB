openapi: 3.0.3
info:
  title: PixelAgent Software Studio API
  version: 1.1.0
  description: >-
    Personal static-app generation, evidence and version API. Use X-API-Key or Authorization Bearer when
    server authentication is enabled. Shared keys do not provide per-user identity or permissions. Model-using
    POST operations are explicit and may incur provider charges; never retry automatically on ambiguous
    transport failure. Request acceptance, successful compilation, browser verification and manual approval
    are separate states.
servers:
  - url: http://127.0.0.1:3100
security:
  - ApiKey: []
  - Bearer: []
tags:
  - name: Studio
paths:
  /api/studio/projects:
    get:
      operationId: listStudioProjects
      tags:
        - Studio
      summary: List projects, newest first
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - projects
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: createStudioProject
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Persisted initial-creation key. Same key and trimmed description returns the original project; conflicting or incomplete reservations return 409. Other POST operations do not support this key. Authentication and rate limits still apply.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
      tags:
        - Studio
      summary: Start Manager/Coder generation (model usage)
      description: >-
        Accepted is not completed. Poll the returned projectUrl. No automatic retry of the paid task;
        compilation may trigger up to three code attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedProject'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: getStudioProject
      tags:
        - Studio
      summary: Read source rounds, build evidence, metrics and current review
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/preview:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: getStudioPreview
      tags:
        - Studio
      summary: Read self-contained HTML as JSON
      description: >-
        Only ready_for_review projects. Treat generated HTML as untrusted; use an isolated sandbox, never
        insert it into the host page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - html
                properties:
                  html:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/archive:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: downloadStudioArchive
      tags:
        - Studio
      summary: Download source ZIP; not an approved release
      responses:
        '200':
          description: Source ZIP with preview and build report
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/events:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: listStudioEvents
      tags:
        - Studio
      summary: Read or stream the project event timeline
      description: >-
        Events are appended as the project runs (planning, coding rounds, real build results,
        terminal state, then test-plan and browser-check activity for the finished preview).
        With stream=1 the response is Server-Sent Events: events after `after` (or Last-Event-ID)
        are replayed, live events follow, and the stream ends after the generation's terminal
        event (ready_for_review, failed or cancelled). Projects created before event logs existed
        return a coarse timeline rebuilt from the saved record with derived=true.
      parameters:
        - name: after
          in: query
          required: false
          description: Return only events with a larger sequence number.
          schema:
            type: integer
            minimum: 0
        - name: stream
          in: query
          required: false
          description: Set to 1 for a text/event-stream response.
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Event timeline
          content:
            application/json:
              schema:
                type: object
                required:
                  - events
                  - derived
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudioEvent'
                  derived:
                    type: boolean
                    description: True when no event log exists and the timeline was rebuilt from the record.
            text/event-stream:
              schema:
                type: string
                description: 'Each message has `id: <seq>`, `event: studio` and `data: <StudioEvent JSON>`; `: ping` comments keep the connection open.'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/cancel:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    post:
      operationId: cancelStudioProject
      tags:
        - Studio
      summary: Cancel active generation
      description: No request body. Queued/running projects only; cancellation does not create an archive.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/retry:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    post:
      operationId: retryStudioProject
      tags:
        - Studio
      summary: Create a new version from failed/cancelled generation (model usage)
      description: No request body. Original records remain unchanged; wait until the old task has actually stopped.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedProject'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/revise:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    post:
      operationId: reviseStudioProject
      tags:
        - Studio
      summary: Create a new version with an additional requirement (model usage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseProject'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedProject'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/repair:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    post:
      operationId: repairStudioProject
      tags:
        - Studio
      summary: Create a new version from saved failure evidence (model usage)
      description: >-
        Supply exactly one diagnosticId or browserRunId. Evidence must belong to this current successful
        preview. Browser repair requires a completed application failure with matching plan/preview hashes;
        infrastructure failures, cancellations and stale reports are rejected. New versions need retesting and
        do not inherit approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairProject'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedProject'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/versions:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: listStudioVersions
      tags:
        - Studio
      summary: Read the version family and manually selected candidate
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - rootProjectId
                  - selectedProjectId
                  - versions
                properties:
                  rootProjectId:
                    type: string
                    pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
                  selectedProjectId:
                    type: string
                    pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
                    nullable: true
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: selectStudioVersion
      tags:
        - Studio
      summary: Select a successful version in this family
      description: Selection is a preference, not approval. New generation does not automatically replace it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - selectedProjectId
                properties:
                  selectedProjectId:
                    type: string
                    pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/changes:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: getStudioChanges
      tags:
        - Studio
      summary: Read complete before/after source contents for a successful derived version
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - changes
                properties:
                  changes:
                    $ref: '#/components/schemas/SourceChanges'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/diagnostics:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: listStudioDiagnostics
      tags:
        - Studio
      summary: Read saved client observations
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - reports
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Diagnostic'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: saveStudioDiagnostic
      tags:
        - Studio
      summary: Save client observations for the current preview
      description: >-
        testPlanId and checks must appear together and match a ready saved plan. Passing results must match
        expected values without an error. Client observations are not independent browser proof. Saving new
        diagnostics invalidates the current approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - report
                properties:
                  report:
                    $ref: '#/components/schemas/Diagnostic'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/test-plans:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: listStudioTestPlans
      tags:
        - Studio
      summary: Read Tester plans, including failures and interruptions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - plans
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/TestPlan'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: createOrCancelStudioTestPlan
      tags:
        - Studio
      summary: Generate a Tester plan (model usage), or cancel an active plan
      description: >-
        Send {} to generate; poll GET test-plans until ready/failed/cancelled. Send cancelPlanId to cancel
        without model usage; cancellation returns 200 with {plan}. Plans contain at most ten uniquely named
        checks; completeness must be reviewed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Cancelled plan
          content:
            application/json:
              schema:
                type: object
                required:
                  - plan
                properties:
                  plan:
                    $ref: '#/components/schemas/TestPlan'
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - planId
                  - jobId
                properties:
                  planId:
                    type: string
                    pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
                  jobId:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/browser-runs:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: listStudioBrowserRuns
      tags:
        - Studio
      summary: Read independent browser reports and availability
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                  - runs
                properties:
                  enabled:
                    type: boolean
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrowserRun'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: startOrCancelStudioBrowserRun
      tags:
        - Studio
      summary: Execute a saved plan in sandboxed Chromium, or cancel a run
      description: >-
        Supply exactly one testPlanId or cancelRunId. No model usage. Starting requires enabled browser checks
        and a ready plan for the current successful preview. Poll GET browser-runs. A passed report covers
        only its plan, never automatic approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserRequest'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - runId
                  - jobId
                properties:
                  runId:
                    type: string
                    pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
                  jobId:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/browser-runs/{runId}/{name}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum:
            - initial.png
            - final.png
    get:
      operationId: getStudioBrowserScreenshot
      tags:
        - Studio
      summary: Download an existing saved initial/final screenshot
      responses:
        '200':
          description: PNG screenshot from the saved report
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /api/studio/projects/{projectId}/reviews:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    get:
      operationId: listStudioReviews
      tags:
        - Studio
      summary: Read review history and current valid decision
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - reviews
                  - current
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  current:
                    anyOf:
                      - $ref: '#/components/schemas/Review'
                      - type: object
                        nullable: true
                        enum:
                          - null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: saveStudioReview
      tags:
        - Studio
      summary: Record an explicit human review decision
      description: >-
        Approved requires the latest current-preview diagnostic to be loaded, without errors or failed checks.
        operator is a user-supplied label, not an authenticated identity. ManuallyReviewed must be true;
        clients must never infer or submit approval from compilation or browser checks alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - review
                properties:
                  review:
                    $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    Bearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
    StudioEvent:
      type: object
      required:
        - seq
        - at
        - type
      properties:
        seq:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - queued
            - phase
            - plan_ready
            - code_ready
            - build_failed
            - build_passed
            - ready_for_review
            - failed
            - cancelled
            - test_plan_started
            - test_plan_ready
            - test_plan_failed
            - browser_run_started
            - browser_check
            - browser_run_finished
        round:
          type: integer
          minimum: 1
        data:
          type: object
          description: Type-specific details, e.g. phase name, file count, the first three compiler errors, or check results.
          additionalProperties: true
    AcceptedProject:
      type: object
      required:
        - projectId
        - jobId
        - projectUrl
      properties:
        projectId:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
        jobId:
          type: string
        projectUrl:
          type: string
    CreateProject:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          maxLength: 4000
          minLength: 1
          pattern: \S
    ReviseProject:
      type: object
      required:
        - changeRequest
      properties:
        changeRequest:
          type: string
          maxLength: 4000
          minLength: 1
          pattern: \S
    SelectVersion:
      type: object
      required:
        - projectId
      properties:
        projectId:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
    RepairProject:
      oneOf:
        - type: object
          required:
            - diagnosticId
          properties:
            diagnosticId:
              type: string
              pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
          additionalProperties: false
        - type: object
          required:
            - browserRunId
          properties:
            browserRunId:
              type: string
              pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
          additionalProperties: false
    PlanRequest:
      oneOf:
        - type: object
          properties: {}
          additionalProperties: false
        - type: object
          required:
            - cancelPlanId
          properties:
            cancelPlanId:
              type: string
          additionalProperties: false
    BrowserRequest:
      oneOf:
        - type: object
          required:
            - testPlanId
          properties:
            testPlanId:
              type: string
          additionalProperties: false
        - type: object
          required:
            - cancelRunId
          properties:
            cancelRunId:
              type: string
          additionalProperties: false
    CheckResult:
      type: object
      required:
        - name
        - status
        - actual
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
        status:
          type: string
          enum:
            - passed
            - failed
        actual:
          type: string
          maxLength: 300
        error:
          type: string
          maxLength: 2000
      additionalProperties: false
    ReviewInput:
      type: object
      required:
        - previewFile
        - diagnosticId
        - decision
        - operator
        - note
        - manuallyReviewed
      properties:
        previewFile:
          type: string
          pattern: ^v[1-3]/dist/index\.html$
        diagnosticId:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
        decision:
          type: string
          enum:
            - approved
            - changes_requested
        operator:
          type: string
          maxLength: 80
          minLength: 1
          pattern: \S
        note:
          type: string
          maxLength: 2000
          minLength: 1
          pattern: \S
        manuallyReviewed:
          type: boolean
          enum:
            - true
      additionalProperties: false
    GenerationMetrics:
      type: object
      required:
        - status
        - elapsedMs
        - buildAttempts
        - failedBuilds
        - agentTasks
        - reportedUsageTasks
        - missingUsageTasks
        - reportedTokens
        - models
        - costUsd
      properties:
        status:
          type: string
          enum:
            - queued
            - running
            - ready_for_review
            - failed
            - cancelled
        elapsedMs:
          type: number
          minimum: 0
          nullable: true
        buildAttempts:
          type: integer
          minimum: 0
        failedBuilds:
          type: integer
          minimum: 0
        agentTasks:
          type: integer
          minimum: 0
        reportedUsageTasks:
          type: integer
          minimum: 0
        missingUsageTasks:
          type: integer
          minimum: 0
        reportedTokens:
          type: number
          minimum: 0
        models:
          type: array
          items:
            type: string
        costUsd:
          type: number
          nullable: true
          enum:
            - null
    SourceFile:
      type: object
      required:
        - path
        - content
      properties:
        path:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        description:
          type: string
    TaskResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - success
            - partial
            - failed
        output:
          type: object
          properties:
            files:
              type: array
              items:
                $ref: '#/components/schemas/SourceFile'
            llmProvider:
              type: string
            llmModel:
              type: string
            llmUsage:
              type: object
        reasoning:
          type: string
    BuildReport:
      type: object
      required:
        - status
        - errors
        - checkedFiles
        - browserVerified
      properties:
        status:
          type: string
          enum:
            - passed
            - failed
        errors:
          type: array
          items:
            type: string
        checkedFiles:
          type: array
          items:
            type: string
        browserVerified:
          type: boolean
    BrowserAction:
      oneOf:
        - type: object
          required:
            - type
            - ms
          properties:
            type:
              type: string
              enum:
                - wait
            ms:
              type: integer
              minimum: 50
              maximum: 6000
              description: Wait duration in milliseconds; waits total at most 8000 ms per check.
          additionalProperties: false
        - type: object
          required:
            - type
            - selector
          properties:
            type:
              type: string
              enum:
                - click
            nth:
              type: integer
              minimum: 0
              maximum: 49
              description: Zero-based index in document order; requires at least nth + 1 matches. Without nth exactly one match is required.
            selector:
              type: string
              maxLength: 160
              minLength: 1
          additionalProperties: false
        - type: object
          required:
            - type
            - selector
            - value
          properties:
            type:
              type: string
              enum:
                - input
            nth:
              type: integer
              minimum: 0
              maximum: 49
              description: Zero-based index in document order; requires at least nth + 1 matches. Without nth exactly one match is required.
            selector:
              type: string
              maxLength: 160
              minLength: 1
            value:
              type: string
              maxLength: 300
          additionalProperties: false
        - type: object
          required:
            - type
            - selector
            - key
          properties:
            type:
              type: string
              enum:
                - key
            nth:
              type: integer
              minimum: 0
              maximum: 49
              description: Zero-based index in document order; requires at least nth + 1 matches. Without nth exactly one match is required.
            selector:
              type: string
              maxLength: 160
              minLength: 1
            key:
              type: string
              maxLength: 32
              minLength: 1
          additionalProperties: false
    BrowserCheck:
      type: object
      required:
        - name
        - actions
        - selector
        - expected
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
        trace:
          type: string
          maxLength: 300
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BrowserAction'
          maxItems: 16
        selector:
          type: string
          maxLength: 160
          minLength: 1
        nth:
          type: integer
          minimum: 0
          maximum: 49
          description: Zero-based index in document order; requires at least nth + 1 matches. Forbidden with count. Changed and unchanged use the same index before and after.
        expected:
          type: string
          maxLength: 300
        assertion:
          type: string
          enum:
            - text
            - matches
            - disabled
            - visible
            - count
            - attribute
            - changed
            - unchanged
            - stable
          description: Changed and unchanged compare collapsed rendered text with its baseline before the first action, also accepting matching textContent or rendered text with text-transform disabled; expected must be "", and at least one action is required. Changed polls up to 2 s for a difference; unchanged samples every 50 ms for 500 ms and fails on the first difference. Changed captures the baseline right after actions if the selector had no matches before them; unchanged requires the selected index before actions. Both require it on every sample. Stable waits 100 ms after actions to capture collapsed rendered text, then samples every 100 ms for 1500 ms and fails on the first difference using the same text alternatives; expected must be "", zero actions are allowed, and the selected index is required on every sample. Defaults to text; disabled and visible require expected "true" or "false". Visible requires a non-empty box, no visibility:hidden, and no computed opacity 0 on the element or any ancestor. Count compares the number of selector matches (including zero), with expected matching ^\d{1,4}$. All other assertions and action selectors require exactly one element unless nth selects an index. Count forbids nth. Matches tests a JavaScript regular expression source of 1–200 characters, without slashes or flags, compiled with u; patterns matching the nested-group-quantifier guard /\([^)]*[+*][^)]*\)[+*{]/ are rejected. It polls up to 2 s against collapsed rendered text, collapsed textContent or collapsed rendered text with text-transform disabled, or, with optional attribute, against the exact attribute value using the attribute assertion rules. Use ^…$ to match the whole text. Attribute class requires every whitespace-separated expected token in classList; empty expected requires no classes. Matches still tests the full class string. Other attributes compare exactly without whitespace collapse; missing attributes read as "", and value reads the live property for input, textarea and select; checked reads a checkbox or radio's live state as "true" or "false".
        attribute:
          type: string
          pattern: ^(?:[a-z][a-z0-9-]{0,49}|(?:style|css)\.[a-z][a-z-]{0,39})$
          description: Required for assertion attribute, optional for matches, changed, unchanged and stable, forbidden otherwise. With changed, unchanged or stable, every baseline and sample reads this attribute instead of text using the same attribute reading rules, including the full class string. A style.<property> name reads the trimmed inline value with element.style.getPropertyValue, for example style.width returns "90%"; a missing property reads "". A css.<property> name reads getComputedStyle(element).getPropertyValue with whitespace trimmed, for example css.transform returns "matrix(-1, 0, 0, -1, 0, 0)" or "none", css.background-color returns "rgb(255, 0, 0)", and css.display can return "none". Both property forms must match [a-z][a-z-]{0,39}.
      additionalProperties: false
    TestPlan:
      type: object
      required:
        - id
        - projectId
        - previewFile
        - jobId
        - status
        - startedAt
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
        projectId:
          type: string
          pattern: ^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$
        previewFile:
          type: string
          pattern: ^v[1-3]/dist/index\.html$
        jobId:
          type: string
        status:
          type: string
          enum:
